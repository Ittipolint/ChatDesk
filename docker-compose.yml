services:
  chatdesk:
    image: ghcr.io/ittipolint/chatdesk:latest
    build: .
    container_name: chatdesk
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # เปิดโหมดอ่านค่าจาก env (config.sample.php จะใช้ env แทน default)
      CD_ENV_CONFIG: "1"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-chatdesk}"
      DB_USER: "${DB_USER:-chatdesk}"
      DB_PASS: "${DB_PASS:-changeme}"
      N8N_PUSH_URL: "http://n8n:5678/webhook/chatdesk-push"
      N8N_SECRET: ""
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASS: "${ADMIN_PASS:-changeme}"
      APP_TITLE: "ChatDesk"
      APP_SUBTITLE: "กล่องข้อความ LINE"
      APP_TIMEZONE: "Asia/Bangkok"
      APP_WEB_PATH: ""
      APP_POLL_INBOX: "5"
      APP_POLL_THREAD: "3"
      APP_MAX_LENGTH: "2000"
      APP_AUTO_MUTE_BOT: "true"
      APP_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: chatdesk-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-rootpass}"
      MARIADB_DATABASE: "${DB_NAME:-chatdesk}"
      MARIADB_USER: "${DB_USER:-chatdesk}"
      MARIADB_PASSWORD: "${DB_PASS:-changeme}"
    volumes:
      - chatdesk-db-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  n8n:
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
    container_name: chatdesk-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=true
      - N8N_RUNNERS_ENABLED=true
      # ⚠️ เปลี่ยน key เป็นค่าสุ่มใน .env ก่อนใช้งานจริง
      # อย่าเปลี่ยนภายหลังที่สร้าง credentials แล้ว — จะถอดรหัสไม่ได้
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme-chatdesk-n8n-key-2026}
      - N8N_USER_MANAGEMENT_DISABLED=true
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  chatdesk-db-data: {}
  n8n-data: {}